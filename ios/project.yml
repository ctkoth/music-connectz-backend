# XcodeGen spec — the Xcode project is GENERATED from this file, never committed.
#
# Why: a .xcodeproj is a 2,000-line pbxproj that only Xcode can edit sanely, and
# you don't have a Mac. This file is the source of truth instead; CI runs
# `xcodegen generate` before it builds. Adding a Swift file needs no edit here —
# the whole MusicConnectZ/ directory is globbed.
name: MusicConnectZ
options:
  bundleIdPrefix: net.musicconnectz
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Warnings are cheap to fix now and expensive to fix at review time.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  MusicConnectZ:
    type: application
    platform: iOS
    sources:
      - path: MusicConnectZ
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.musicconnectz.app
        INFOPLIST_FILE: MusicConnectZ/Info.plist
        CODE_SIGN_ENTITLEMENTS: MusicConnectZ/MusicConnectZ.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
    entitlements:
      path: MusicConnectZ/MusicConnectZ.entitlements
      properties:
        com.apple.developer.applesignin: [Default]

  MusicConnectZTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: MusicConnectZ
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.musicconnectz.app.tests

schemes:
  MusicConnectZ:
    build:
      targets:
        MusicConnectZ: all
        MusicConnectZTests: [test]
    test:
      targets:
        - MusicConnectZTests
    archive:
      config: Release
