name: iOS

# You don't own a Mac, so this workflow IS your Mac. GitHub's macOS runners have
# Xcode; every build, test and TestFlight upload happens here.
#
#   Actions -> iOS -> Run workflow
#
# The `build` job needs no secrets at all — it compiles and runs the tests on a
# simulator, which is the check you want on every push. `testflight` is the one
# that needs an Apple account, and it skips cleanly until you add the secrets.
on:
  push:
    branches: ["main"]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the build to TestFlight"
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + test (simulator)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      # The .xcodeproj is generated, never committed — see ios/project.yml.
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      # Simulator builds are unsigned, which is exactly why this job needs no
      # Apple account. A compile error shows up here, not at upload time.
      - name: Build and test
        run: |
          cd ios
          xcodebuild test \
            -project MusicConnectZ.xcodeproj \
            -scheme MusicConnectZ \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}

  testflight:
    name: Archive + upload to TestFlight
    runs-on: macos-14
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.upload
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      # Cloud signing: Xcode creates and downloads the certificate and profile
      # itself using the App Store Connect API key. That's what makes this work
      # without a Mac — there are no .p12 files to export from a machine you
      # don't have.
      - name: Write the App Store Connect API key
        env:
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          if [ -z "$KEY_P8" ]; then
            echo "::error::APP_STORE_CONNECT_KEY_P8 is not set. See IOS_APP.md §4."
            exit 1
          fi
          mkdir -p ~/private_keys
          echo "$KEY_P8" | base64 --decode > ~/private_keys/AuthKey.p8

      - name: Build number from the run number
        run: echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cd ios
          xcodebuild archive \
            -project MusicConnectZ.xcodeproj \
            -scheme MusicConnectZ \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/MusicConnectZ.xcarchive" \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Export the .ipa
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MusicConnectZ.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app -f "$RUNNER_TEMP/export/MusicConnectZ.ipa" \
            -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      # Keep the .ipa even when the upload fails, so a rejected build is still
      # something you can inspect rather than a run you have to repeat.
      - name: Keep the build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MusicConnectZ-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore
