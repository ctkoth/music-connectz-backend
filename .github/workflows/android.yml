name: Android APK

# Builds the installable APKs. GitHub's ubuntu runners ship the Android SDK, so
# this is the build that produces a real file you can download and sideload:
#   Actions -> this run -> Artifacts -> music-connectz-apk   (Music ConnectZ)
#                                       bodiez-apk           (BodieZ, its own app)
#
# It also builds the Play upload bundles (.aab). Play distributes app bundles,
# not APKs — the APK is for testing on your own phone. Two flavors, two bundles,
# because they are two Play listings (see android/app/build.gradle.kts).
on:
  push:
    branches: ["main"]
    paths: ["android/**", "tools/make_brand_assets.py", "tools/make_bodiez_assets.py", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "tools/make_brand_assets.py", "tools/make_bodiez_assets.py", ".github/workflows/android.yml"]
  # Build on demand — this is the button to press when you want an APK.
  workflow_dispatch:
    inputs:
      site_url:
        description: "Site Music ConnectZ opens"
        default: "https://musicconnectz.net"
        required: false
      bodiez_url:
        description: "Site BodieZ opens (the BodieZ-only build, on its own host)"
        default: "https://bodiez.musicconnectz.net"
        required: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    # A step's `if` cannot read `secrets` — GitHub refuses to parse the whole
    # workflow ("Unrecognized named-value: 'secrets'"), so this file has been a
    # failed run on every push, before any step started, and no APK or bundle has
    # ever come out of it. `env` IS readable in an `if`, so the secret goes through
    # the job's env and the step asks about that.
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Debug APK (sideloadable)
        run: >-
          ./gradlew --no-daemon assembleMczDebug assembleBodiezDebug
          -PsiteUrl=${{ github.event.inputs.site_url || 'https://musicconnectz.net' }}
          -PbodiezUrl=${{ github.event.inputs.bodiez_url || 'https://bodiez.musicconnectz.net' }}

      # Signed when the secrets are set, unsigned otherwise. An unsigned bundle is
      # fine to inspect and is REFUSED by Play Console ("The Android App Bundle was
      # not signed"), so a missing keystore is a warning on the run, not a failure.
      - name: Say so when the bundles are unsigned
        if: ${{ env.KEYSTORE_B64 == '' }}
        run: echo "::warning title=Bundles are unsigned::ANDROID_KEYSTORE_BASE64 is not set, so the .aab files cannot be uploaded to Play. See GOOGLE_PLAY.md section 4."

      - name: Decode upload keystore
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Play bundle (.aab)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon bundleMczRelease bundleBodiezRelease
          -PsiteUrl=${{ github.event.inputs.site_url || 'https://musicconnectz.net' }}
          -PbodiezUrl=${{ github.event.inputs.bodiez_url || 'https://bodiez.musicconnectz.net' }}

      - uses: actions/upload-artifact@v4
        with:
          name: music-connectz-apk
          path: android/app/build/outputs/apk/mcz/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: bodiez-apk
          path: android/app/build/outputs/apk/bodiez/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: music-connectz-playstore-bundle
          path: android/app/build/outputs/bundle/mczRelease/*.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: bodiez-playstore-bundle
          path: android/app/build/outputs/bundle/bodiezRelease/*.aab
          if-no-files-found: error
