name: Android APK

# Builds the installable APK. GitHub's ubuntu runners ship the Android SDK, so
# this is the build that produces a real file you can download and sideload:
#   Actions -> this run -> Artifacts -> music-connectz-apk
#
# It also builds the Play upload bundle (.aab). Play distributes app bundles,
# not APKs — the APK is for testing on your own phone.
on:
  push:
    branches: ["main"]
    paths: ["android/**", "tools/make_brand_assets.py", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "tools/make_brand_assets.py", ".github/workflows/android.yml"]
  # Build on demand — this is the button to press when you want an APK.
  workflow_dispatch:
    inputs:
      site_url:
        description: "Site the app opens"
        default: "https://musicconnectz.net"
        required: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Debug APK (sideloadable)
        run: >-
          ./gradlew --no-daemon assembleDebug
          -PsiteUrl=${{ github.event.inputs.site_url || 'https://musicconnectz.net' }}

      # Signed when the secrets are set, unsigned otherwise — Play can sign an
      # unsigned bundle on upload, so a missing keystore is not a failure.
      - name: Decode upload keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Play bundle (.aab)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon bundleRelease
          -PsiteUrl=${{ github.event.inputs.site_url || 'https://musicconnectz.net' }}

      - uses: actions/upload-artifact@v4
        with:
          name: music-connectz-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: music-connectz-playstore-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
