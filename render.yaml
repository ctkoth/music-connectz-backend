services:
  - type: web
    name: music-connectz-backend
    runtime: python
    branch: main
    autoDeploy: true
    rootDir: .
    buildCommand: "./build.sh"
    # --access-logfile makes slow requests visible in the Render log stream, and
    # recycling workers keeps a leaked/wedged one from degrading the whole box.
    startCommand: "gunicorn music_connectz.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 --graceful-timeout 30 --max-requests 500 --max-requests-jitter 50 --access-logfile - --error-logfile -"
    # `/` is a static JSON payload that touches no database, so a failing health
    # check means the process itself is wedged and Render should replace it.
    healthCheckPath: /
    # Where member uploads actually live. This survives a deploy; the rest of
    # the container does not. MEDIA_ROOT below points at the same mountPath and
    # MEDIA_DURABLE asserts it to storage_health — the three move TOGETHER, and
    # that is the point of them being in one file. Render will not attach a
    # disk to a free instance, and if it refuses this one the blueprint sync
    # fails and MEDIA_DURABLE never lands either. A "durable" flag over an
    # ephemeral disk is the one lie the health check can tell; keeping the
    # claim in the same commit as the thing it claims is what stops it.
    #
    # A service with a disk deploys with a short gap instead of zero-downtime.
    # That is the price. It is seconds, once per deploy, against never losing
    # a member's only copy of a take.
    disk:
      name: mcz-media
      mountPath: /var/mcz-media
      sizeGB: 10
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      # "Sign in with Google" (GOOGLE_OAUTH_CLIENT_ID alone, above) only ever
      # checks an ID token — no API access, no secret needed. Reading a
      # member's real YouTube subscriber count (SocialZ reach verification)
      # is a different, scoped access-token exchange, and THAT needs a
      # confidential client. Same Google Cloud OAuth client works for both;
      # this is just the secret the ID-token flow never had to ask for.
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: APPLE_OAUTH_CLIENT_ID
        sync: false
      # The rest of apps/accounts/oauth.py's OAUTH2_PROVIDERS registry (each
      # needs both halves — provider_status() in oauth.py won't advertise a
      # client ID whose secret is missing, and the button for it disappears
      # rather than send a member to the provider only to refuse on the way
      # back). These five were coded and had working frontend buttons for a
      # long time with NO entry here at all — a from-scratch deploy off this
      # blueprint left every one of them silently unconfigured no matter what
      # the code could do, because Render only prompts for a value on a key
      # the blueprint actually declares.
      - key: SPOTIFY_OAUTH_CLIENT_ID
        sync: false
      - key: SPOTIFY_OAUTH_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_OAUTH_CLIENT_ID
        sync: false
      - key: MICROSOFT_OAUTH_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_OAUTH_CLIENT_ID
        sync: false
      - key: FACEBOOK_OAUTH_CLIENT_SECRET
        sync: false
      - key: SOUNDCLOUD_OAUTH_CLIENT_ID
        sync: false
      - key: SOUNDCLOUD_OAUTH_CLIENT_SECRET
        sync: false
      - key: TWITTER_OAUTH_CLIENT_ID
        sync: false
      - key: TWITTER_OAUTH_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_OAUTH_CLIENT_ID
        sync: false
      - key: LINKEDIN_OAUTH_CLIENT_SECRET
        sync: false
      # ---- KEEPING MEMBERS' UPLOADS -------------------------------------
      # This container's disk is rebuilt on every deploy. With neither of the
      # two options below in force, every track, video and cover any member has
      # uploaded is DELETED the next time anything merges to main, while the
      # Upload rows survive in Postgres — so the app goes on serving links to
      # files that are not there. `manage.py check` says so on every deploy
      # (economy.W001) and `GET /` reports it in `uploads`.
      #
      # OPTION 1 — a bucket (S3 / Cloudflare R2). Scales, no instance pinning,
      # needs credentials. Set S3_BUCKET_NAME + the two keys below; add
      # S3_ENDPOINT_URL for R2. settings.py switches over on the next restart.
      #
      # OPTION 2 — a persistent disk, and the one IN FORCE. No credentials and
      # no external account; it pins this service to a single instance and
      # needs a paid instance type. The `disk:` block above is mounted and the
      # two MEDIA_* vars below point at it.
      #
      # Neither is a code change. Both are already wired. OPTION 2 is the one
      # in force: the `disk:` above is mounted at this exact path, and
      # MEDIA_DURABLE is the deliberate assertion that it is a real mount —
      # set here, beside the disk it describes, so the two cannot drift apart
      # in somebody's dashboard. Setting the S3_* keys below switches to a
      # bucket and takes precedence; the disk can be dropped then.
      - key: MEDIA_ROOT
        value: /var/mcz-media
      - key: MEDIA_DURABLE
        value: "1"
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_CUSTOM_DOMAIN
        sync: false
      # Where the frontend lives — used to build checkout return URLs.
      - key: FRONTEND_URL
        sync: false
      # Payments — wallet funding. Each provider activates only when its keys
      # are set; leave unset to hide that button in the client.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: PAYPAL_MODE
        sync: false
      # Modal — the sandbox OCC runs code in. Both are required together; with
      # either missing, /occ/spec/ reports can_execute=false and the Run panel
      # renders the reason instead of a button. Get them from
      # modal.com -> Settings -> API Tokens.
      - key: MODAL_TOKEN_ID
        sync: false
      - key: MODAL_TOKEN_SECRET
        sync: false
